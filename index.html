<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cosmos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000;
    touch-action: none;
    overscroll-behavior: none;
  }
  canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0;
    touch-action: none;
  }
  #overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
    opacity: 0; transition: opacity 2s ease-in;
  }
  #overlay.visible { opacity: 1; }
  #title {
    position: absolute; top: 24px; left: 24px;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    font-size: 18px; font-weight: 300; letter-spacing: 6px; text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }
  #hint {
    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    font-size: 14px; font-weight: 300; letter-spacing: 2px;
    color: rgba(255,255,255,0.4);
    transition: opacity 1.5s ease-out;
    white-space: nowrap;
  }
  #hint.hidden { opacity: 0; }
  #fade {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; z-index: 20;
    transition: opacity 2s ease-out;
    pointer-events: none;
  }
  #fade.out { opacity: 0; }
  #mic-btn {
    position: fixed; top: 24px; right: 24px; z-index: 15;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.5);
    font-size: 18px; line-height: 40px; text-align: center;
    cursor: pointer; pointer-events: auto;
    transition: all 0.3s ease;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #mic-btn.active {
    background: rgba(255,60,60,0.25);
    border-color: rgba(255,60,60,0.6);
    color: rgba(255,100,100,0.9);
    box-shadow: 0 0 12px rgba(255,60,60,0.3);
  }
  #shape-label {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    font-size: 13px; font-weight: 300; letter-spacing: 3px; text-transform: uppercase;
    color: rgba(255,255,255,0.0);
    pointer-events: none; z-index: 15;
    transition: color 0.5s ease;
    white-space: nowrap;
  }
  #shape-label.show { color: rgba(255,255,255,0.5); }
</style>
</head>
<body>
<div id="fade"></div>
<div id="overlay">
  <div id="title">Cosmos</div>
  <div id="hint">double-tap to morph &bull; shake for meteors</div>
</div>
<button id="mic-btn">&#x1f3a4;</button>
<div id="shape-label"></div>
<canvas id="c"></canvas>
<script>
// ============================================================
// COSMOS — Interactive Particle Galaxy
// ============================================================

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());
document.addEventListener('touchstart', e => { if (e.target.id === 'c') e.preventDefault(); }, { passive: false });
document.addEventListener('touchmove', e => { if (e.target.id === 'c') e.preventDefault(); }, { passive: false });
document.addEventListener('touchend', e => { if (e.target.id === 'c') e.preventDefault(); }, { passive: false });

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1);
const NUM_PARTICLES = isMobile ? 20000 : 100000;
const MAX_ATTRACTORS = 4;

let width, height, cssW, cssH;
let time = 0, lastTime = 0, introProgress = 0, idleTime = 0, cameraAngle = 0;
let hintHidden = false;

// Audio state
let audioCtx = null, analyser = null, audioData = null;
let audioActive = false;
let audioBass = 0, audioMid = 0, audioTreble = 0, audioEnergy = 0;

// Shape morphing state
const SHAPES = ['spiral', 'ring', 'heart', 'helix', 'infinity'];
const SHAPE_LABELS = ['Spiral Galaxy', 'Ring Nebula', 'Heart Nebula', 'DNA Helix', 'Infinity'];
let currentShape = 0, morphProgress = 1.0, lastTapTime = 0;

const attractors = [];
for (let i = 0; i < MAX_ATTRACTORS; i++) attractors.push({ x: 0, y: 0, strength: 0, id: -1 });

function resize() {
  cssW = window.innerWidth;
  cssH = window.innerHeight;
  // Always render at 1x — retina is not worth the cost
  width = cssW;
  height = cssH;
  canvas.width = width;
  canvas.height = height;
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
}
window.addEventListener('resize', resize);
resize();

// --- Pre-baked color palette LUT (avoids per-particle allocation + trig) ---
const PALETTE_SIZE = 256;
const paletteR = new Uint8Array(PALETTE_SIZE);
const paletteG = new Uint8Array(PALETTE_SIZE);
const paletteB = new Uint8Array(PALETTE_SIZE);

function bakePalette(hueShift) {
  const angle = hueShift * Math.PI * 2;
  const cosH = Math.cos(angle), sinH = Math.sin(angle);
  for (let i = 0; i < PALETTE_SIZE; i++) {
    const t = i / (PALETTE_SIZE - 1);
    let r, g, b;
    if (t < 0.2) {
      const s = t / 0.2;
      r = 0.15 + s * 0.1;  g = 0.05 + s * 0.3;  b = 0.4 + s * 0.4;
    } else if (t < 0.45) {
      const s = (t - 0.2) / 0.25;
      r = 0.25 + s * 0.4;  g = 0.35 + s * 0.15;  b = 0.8 - s * 0.1;
    } else if (t < 0.7) {
      const s = (t - 0.45) / 0.25;
      r = 0.65 + s * 0.3;  g = 0.5 + s * 0.15;  b = 0.7 - s * 0.35;
    } else {
      const s = (t - 0.7) / 0.3;
      r = 0.95 + s * 0.05;  g = 0.65 + s * 0.3;  b = 0.35 + s * 0.55;
    }
    const nr = r * (0.7 + 0.3 * cosH) + g * 0.3 * sinH;
    const ng = g * (0.7 + 0.3 * cosH) - r * 0.15 * sinH + b * 0.15 * sinH;
    const nb = b * (0.7 + 0.3 * cosH) - g * 0.3 * sinH;
    paletteR[i] = Math.max(0, Math.min(255, nr * 255)) | 0;
    paletteG[i] = Math.max(0, Math.min(255, ng * 255)) | 0;
    paletteB[i] = Math.max(0, Math.min(255, nb * 255)) | 0;
  }
}

// --- Particles ---
const px = new Float32Array(NUM_PARTICLES);
const py = new Float32Array(NUM_PARTICLES);
const pz = new Float32Array(NUM_PARTICLES);
const vx = new Float32Array(NUM_PARTICLES);
const vy = new Float32Array(NUM_PARTICLES);
const vz = new Float32Array(NUM_PARTICLES);
const age = new Float32Array(NUM_PARTICLES);
const lifetime = new Float32Array(NUM_PARTICLES);
const morphTargetX = new Float32Array(NUM_PARTICLES);
const morphTargetY = new Float32Array(NUM_PARTICLES);
const morphTargetZ = new Float32Array(NUM_PARTICLES);

function noise3d(x, y, z) {
  const n = Math.sin(x * 12.9898 + y * 78.233 + z * 45.164) * 43758.5453;
  return n - Math.floor(n);
}

function generateShapeTargets(shapeName) {
  const numArms = 4;
  for (let i = 0; i < NUM_PARTICLES; i++) {
    const t = i / NUM_PARTICLES;
    const rand1 = noise3d(i * 0.1, 0, 0);
    const rand2 = noise3d(0, i * 0.1, 0);
    const rand3 = noise3d(0, 0, i * 0.1);
    switch (shapeName) {
      case 'spiral': {
        const arm = i % numArms;
        const armAngle = (arm / numArms) * Math.PI * 2;
        const tr = Math.pow(Math.random(), 0.6);
        const r = 0.05 + tr * 4.0;
        const spiralAngle = armAngle + Math.log(r + 1) * 3.0;
        const spread = (1.0 - tr * 0.4) * 0.9;
        const a = spiralAngle + (rand1 - 0.5) * spread;
        morphTargetX[i] = Math.cos(a) * r + (rand2 - 0.5) * 0.15;
        morphTargetY[i] = Math.sin(a) * r + (rand3 - 0.5) * 0.15;
        morphTargetZ[i] = (rand1 - 0.5) * 0.3;
        break;
      }
      case 'ring': {
        const a = t * Math.PI * 2 + (rand1 - 0.5) * 0.3;
        const rr = 2.5 + (rand2 - 0.5) * 0.8;
        morphTargetX[i] = Math.cos(a) * rr;
        morphTargetY[i] = Math.sin(a) * rr;
        morphTargetZ[i] = (rand3 - 0.5) * 0.4;
        break;
      }
      case 'heart': {
        const a = t * Math.PI * 2;
        const hr = 0.3 + Math.random() * 0.7;
        const hx = 16 * Math.pow(Math.sin(a), 3);
        const hy = 13 * Math.cos(a) - 5 * Math.cos(2*a) - 2 * Math.cos(3*a) - Math.cos(4*a);
        const s = 0.18 * hr;
        morphTargetX[i] = hx * s + (rand1 - 0.5) * 0.3;
        morphTargetY[i] = hy * s + (rand2 - 0.5) * 0.3;
        morphTargetZ[i] = (rand3 - 0.5) * 0.3 * hr;
        break;
      }
      case 'helix': {
        const strand = i % 2;
        const ht = (t * 2 % 1) * 6 - 3;
        const ha = ht * 2.5 + strand * Math.PI;
        const hr = 1.2 + (rand1 - 0.5) * 0.3;
        morphTargetX[i] = Math.cos(ha) * hr + (rand2 - 0.5) * 0.2;
        morphTargetY[i] = ht + (rand3 - 0.5) * 0.2;
        morphTargetZ[i] = Math.sin(ha) * hr + (rand1 - 0.5) * 0.2;
        if (i % 40 < 2) {
          const rt = Math.random();
          const ra = ht * 2.5;
          morphTargetX[i] = Math.cos(ra) * hr * (1 - rt) + Math.cos(ra + Math.PI) * hr * rt;
          morphTargetZ[i] = Math.sin(ra) * hr * (1 - rt) + Math.sin(ra + Math.PI) * hr * rt;
        }
        break;
      }
      case 'infinity': {
        const it = t * Math.PI * 2;
        const is = 2.5;
        const d = 1 + Math.sin(it) * Math.sin(it);
        const r2 = 0.5 + Math.random() * 0.5;
        morphTargetX[i] = is * Math.cos(it) / d * r2 + (rand1 - 0.5) * 0.2;
        morphTargetY[i] = is * Math.sin(it) * Math.cos(it) / d * r2 + (rand2 - 0.5) * 0.2;
        morphTargetZ[i] = (rand3 - 0.5) * 0.3 * r2;
        break;
      }
    }
  }
}

function initParticles() {
  generateShapeTargets('spiral');
  for (let i = 0; i < NUM_PARTICLES; i++) {
    const scatter = 5.0;
    px[i] = morphTargetX[i] + (Math.random() - 0.5) * scatter;
    py[i] = morphTargetY[i] + (Math.random() - 0.5) * scatter;
    pz[i] = morphTargetZ[i] + (Math.random() - 0.5) * scatter * 0.3;
    const a = Math.atan2(morphTargetY[i], morphTargetX[i]);
    const spd = 0.2 + Math.random() * 0.15;
    vx[i] = -Math.sin(a) * spd;
    vy[i] = Math.cos(a) * spd;
    vz[i] = (Math.random() - 0.5) * 0.02;
    age[i] = Math.random() * 12.0;
    lifetime[i] = 6.0 + Math.random() * 10.0;
  }
}
initParticles();

// --- Comets ---
const comets = [];
function spawnComet() {
  if (comets.length >= 15) return;
  const a = Math.random() * Math.PI * 2;
  const spd = 3 + Math.random() * 4;
  const r = 5 + Math.random() * 2;
  const da = a + Math.PI + (Math.random() - 0.5) * 0.8;
  comets.push({
    x: Math.cos(a) * r, y: Math.sin(a) * r, z: (Math.random() - 0.5) * 1.5,
    vx: Math.cos(da) * spd, vy: Math.sin(da) * spd, vz: (Math.random() - 0.5) * 0.5,
    life: 0, maxLife: 1.2 + Math.random() * 1.0,
    trail: new Float32Array(120), trailLen: 0, // flat array: x,y,z per point
    brightness: 0.7 + Math.random() * 0.3, hue: Math.random()
  });
}

function triggerMeteorShower() {
  const count = 8 + Math.floor(Math.random() * 7);
  for (let i = 0; i < count; i++) setTimeout(() => spawnComet(), i * 100 + Math.random() * 200);
}

let lastAccel = { x: 0, y: 0, z: 0 }, lastShakeTime = 0;
if (window.DeviceMotionEvent) {
  window.addEventListener('devicemotion', (e) => {
    const a = e.accelerationIncludingGravity;
    if (!a || a.x === null) return;
    const dx = a.x - lastAccel.x, dy = a.y - lastAccel.y, dz = a.z - lastAccel.z;
    const force = Math.sqrt(dx*dx + dy*dy + dz*dz);
    lastAccel = { x: a.x, y: a.y, z: a.z };
    const now = Date.now();
    if (force > 25 && now - lastShakeTime > 2000) { lastShakeTime = now; triggerMeteorShower(); }
  });
}
setInterval(() => { if (Math.random() < 0.6) spawnComet(); }, 3000);

// --- Audio ---
const micBtn = document.getElementById('mic-btn');
micBtn.addEventListener('click', async (e) => {
  e.stopPropagation();
  if (audioActive) {
    audioActive = false; micBtn.classList.remove('active');
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.7;
    source.connect(analyser);
    audioData = new Uint8Array(analyser.frequencyBinCount);
    audioActive = true; micBtn.classList.add('active');
  } catch (err) { console.warn('Mic denied:', err); }
});

function updateAudio() {
  if (!audioActive || !analyser) {
    audioBass *= 0.9; audioMid *= 0.9; audioTreble *= 0.9; audioEnergy *= 0.9;
    return;
  }
  analyser.getByteFrequencyData(audioData);
  const bins = audioData.length;
  let bass = 0, mid = 0, treble = 0;
  const bassEnd = (bins * 0.15) | 0, midEnd = (bins * 0.5) | 0;
  for (let i = 0; i < bins; i++) {
    const v = audioData[i] * (1/255);
    if (i < bassEnd) bass += v; else if (i < midEnd) mid += v; else treble += v;
  }
  bass /= bassEnd; mid /= (midEnd - bassEnd); treble /= (bins - midEnd);
  audioBass = audioBass * 0.6 + bass * 0.4;
  audioMid = audioMid * 0.6 + mid * 0.4;
  audioTreble = audioTreble * 0.6 + treble * 0.4;
  audioEnergy = audioBass * 0.5 + audioMid * 0.3 + audioTreble * 0.2;
}

// --- Input ---
function screenToWorld(clientX, clientY) {
  const scale = Math.min(width, height) * 0.18;
  return [(clientX - width / 2) / scale, -(clientY - height / 2) / scale];
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault(); idleTime = 0;
  if (!hintHidden) { document.getElementById('hint').classList.add('hidden'); hintHidden = true; }
  const now = Date.now();
  if (now - lastTapTime < 350) {
    currentShape = (currentShape + 1) % SHAPES.length;
    generateShapeTargets(SHAPES[currentShape]);
    morphProgress = 0;
    const label = document.getElementById('shape-label');
    label.textContent = SHAPE_LABELS[currentShape];
    label.classList.add('show');
    setTimeout(() => label.classList.remove('show'), 2000);
    lastTapTime = 0; return;
  }
  lastTapTime = now;
  for (let i = 0; i < MAX_ATTRACTORS; i++) {
    if (attractors[i].id === -1) {
      const [wx, wy] = screenToWorld(e.clientX, e.clientY);
      attractors[i] = { x: wx, y: wy, strength: 1.0, id: e.pointerId }; break;
    }
  }
});

canvas.addEventListener('pointermove', (e) => {
  e.preventDefault(); idleTime = 0;
  for (let i = 0; i < MAX_ATTRACTORS; i++) {
    if (attractors[i].id === e.pointerId) {
      const [wx, wy] = screenToWorld(e.clientX, e.clientY);
      attractors[i].x = wx; attractors[i].y = wy; break;
    }
  }
});

function releasePointer(e) {
  for (let i = 0; i < MAX_ATTRACTORS; i++) {
    if (attractors[i].id === e.pointerId) { attractors[i].id = -1; break; }
  }
}
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
canvas.style.touchAction = 'none';

function smoothstep(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }

// --- ImageData ---
let imgData, pixels;
function setupImageData() {
  imgData = ctx.createImageData(width, height);
  pixels = new Uint32Array(imgData.data.buffer);
}
setupImageData();
window.addEventListener('resize', () => { resize(); setupImageData(); });

// Background fill value
const BG = 0xFF080210; // ABGR

// ============================================================
// MAIN RENDER LOOP — optimized: zero allocations, no blur,
// pre-baked palette LUT, fill() clear, minimal branching
// ============================================================
function frame(now) {
  requestAnimationFrame(frame);
  now *= 0.001;
  if (lastTime === 0) lastTime = now;
  const dt = Math.min(now - lastTime, 0.05);
  lastTime = now; time += dt; idleTime += dt;
  introProgress = Math.min(introProgress + dt * 0.35, 1.0);
  const introT = smoothstep(introProgress);
  if (morphProgress < 1.0) morphProgress = Math.min(1.0, morphProgress + dt * 0.4);
  const morphT = smoothstep(morphProgress);

  updateAudio();
  const audioScale = 1.0 + audioBass * 0.6;
  const audioSparkle = audioTreble * 0.5;

  for (let i = 0; i < MAX_ATTRACTORS; i++) {
    if (attractors[i].id === -1 && attractors[i].strength > 0)
      attractors[i].strength = Math.max(0, attractors[i].strength - dt * 2.0);
  }

  if (idleTime > 5.0) cameraAngle += dt * 0.1;

  const cosA = Math.cos(cameraAngle), sinA = Math.sin(cameraAngle);
  const camDist = 6.0;

  // Bake palette once per frame
  const hueShift = (time * 0.016 + audioMid * 0.3) % 1.0;
  bakePalette(hueShift);

  // --- Physics (update every particle) ---
  const morphPull = morphT < 1.0 ? 2.0 * (1.0 - morphT * 0.5) : 0.5;
  const turbStr = 0.3 + audioSparkle * 2.0;
  const timeOff = time * 0.1;

  for (let i = 0; i < NUM_PARTICLES; i++) {
    age[i] += dt;
    if (age[i] > lifetime[i]) age[i] = 0;

    let x = px[i], y = py[i], z = pz[i];
    let _vx = vx[i], _vy = vy[i], _vz = vz[i];

    // Morph pull
    _vx += (morphTargetX[i] * audioScale - x) * morphPull * dt;
    _vy += (morphTargetY[i] * audioScale - y) * morphPull * dt;
    _vz += (morphTargetZ[i] * audioScale - z) * morphPull * dt;

    // Gravity + orbit (avoid sqrt — use fast inverse approximation)
    const distSq = x * x + y * y + z * z + 0.001;
    const invDist = 1.0 / Math.sqrt(distSq); // single sqrt
    const gravStr = 0.3 / (distSq * 0.25 * invDist + 0.1);
    const dx = -x * invDist, dy = -y * invDist;
    _vx += (dx * gravStr - dy * gravStr * 0.15) * dt;
    _vy += (dy * gravStr + dx * gravStr * 0.15) * dt;
    _vz -= z * 0.15 * dt;

    // Cheap noise (avoid sin-based noise3d — use hash)
    const h = ((x * 374761 + y * 668265 + z * 1277 + timeOff * 50000) | 0) & 0xFFFF;
    _vx += ((h & 0xFF) * (1/255) - 0.5) * turbStr * dt;
    _vy += (((h >> 8) & 0xFF) * (1/255) - 0.5) * turbStr * dt;

    // Attractors
    for (let j = 0; j < MAX_ATTRACTORS; j++) {
      const a = attractors[j];
      if (a.strength > 0.01) {
        const adx = a.x - x, ady = a.y - y;
        const aDsq = adx * adx + ady * ady + 0.3;
        const aF = a.strength * 6.0 / aDsq * dt;
        const aInv = 1.0 / Math.sqrt(aDsq);
        _vx += (adx * aInv + -ady * aInv * 0.3) * aF;
        _vy += (ady * aInv + adx * aInv * 0.3) * aF;
      }
    }

    if (introT < 1.0) {
      const ps = (1.0 - introT) * 0.5 * dt;
      _vx += (morphTargetX[i] - x) * ps;
      _vy += (morphTargetY[i] - y) * ps;
    }

    _vx *= 0.996; _vy *= 0.996; _vz *= 0.996;
    const spdSq = _vx * _vx + _vy * _vy + _vz * _vz;
    if (spdSq > 6.25) { // 2.5^2
      const s = 2.5 / Math.sqrt(spdSq);
      _vx *= s; _vy *= s; _vz *= s;
    }

    x += _vx * dt; y += _vy * dt; z += _vz * dt;
    const rSq = x * x + y * y + z * z;
    if (rSq > 49.0) { // 7^2
      const s = 7.0 / Math.sqrt(rSq);
      x *= s; y *= s; z *= s;
      _vx *= -0.2; _vy *= -0.2; _vz *= -0.2;
    }

    px[i] = x; py[i] = y; pz[i] = z;
    vx[i] = _vx; vy[i] = _vy; vz[i] = _vz;
  }

  // --- Update comets ---
  for (let c = comets.length - 1; c >= 0; c--) {
    const cm = comets[c];
    cm.life += dt;
    if (cm.life > cm.maxLife) { comets.splice(c, 1); continue; }
    cm.x += cm.vx * dt; cm.y += cm.vy * dt; cm.z += cm.vz * dt;
    if (cm.trailLen < 40) {
      const off = cm.trailLen * 3;
      cm.trail[off] = cm.x; cm.trail[off+1] = cm.y; cm.trail[off+2] = cm.z;
      cm.trailLen++;
    } else {
      cm.trail.copyWithin(0, 3);
      cm.trail[117] = cm.x; cm.trail[118] = cm.y; cm.trail[119] = cm.z;
    }
  }

  // --- Render ---
  const cx = width * 0.5, cy = height * 0.5;
  const scale = Math.min(width, height) * 0.18;
  const brightBoost = 1.0 + audioEnergy * 1.5;

  // Clear pixel buffer (fill is ~10x faster than a loop)
  pixels.fill(BG);

  // --- Draw particles into pixel buffer ---
  for (let i = 0; i < NUM_PARTICLES; i++) {
    const rx = px[i] * cosA - pz[i] * sinA;
    const rz = px[i] * sinA + pz[i] * cosA;
    const depth = rz + camDist;
    if (depth < 0.5) continue;
    const projScale = camDist / depth;
    const sx = (cx + rx * scale * projScale) | 0;
    const sy = (cy - py[i] * scale * projScale) | 0;
    if (sx < 1 || sx >= width - 2 || sy < 1 || sy >= height - 2) continue;

    const ageFrac = age[i] / lifetime[i];
    if (ageFrac < 0.02 || ageFrac > 0.98) continue;
    const fade = (ageFrac < 0.15 ? ageFrac / 0.15 : ageFrac > 0.8 ? (1 - ageFrac) / 0.2 : 1.0);
    const spdSq = vx[i] * vx[i] + vy[i] * vy[i] + vz[i] * vz[i];
    const spd = Math.sqrt(spdSq);

    // Palette lookup (no allocation, no trig)
    const colorIdx = Math.min(255, (spd * 102 + 127.5 / depth) | 0);
    const cr = paletteR[colorIdx], cg = paletteG[colorIdx], cb = paletteB[colorIdx];

    // Simple depth fade (avoid exp)
    const depthFade = depth < 3 ? 1 : 3 / depth;
    const alpha = fade * depthFade * (0.7 + spd * 0.4) * projScale * brightBoost;
    if (alpha < 0.03) continue;

    const a = alpha > 1 ? 1 : alpha;
    const ir = (cr * a) | 0;
    const ig = (cg * a) | 0;
    const ib = (cb * a) | 0;

    // Write 2x2 block — additive blend
    const p0 = sy * width + sx;
    const p1 = p0 + 1;
    const p2 = p0 + width;
    const p3 = p2 + 1;

    let e0 = pixels[p0];
    pixels[p0] = 0xFF000000 |
      (Math.min(255, ((e0 >> 16) & 0xFF) + ib) << 16) |
      (Math.min(255, ((e0 >> 8) & 0xFF) + ig) << 8) |
      Math.min(255, (e0 & 0xFF) + ir);

    let e1 = pixels[p1];
    pixels[p1] = 0xFF000000 |
      (Math.min(255, ((e1 >> 16) & 0xFF) + ib) << 16) |
      (Math.min(255, ((e1 >> 8) & 0xFF) + ig) << 8) |
      Math.min(255, (e1 & 0xFF) + ir);

    let e2 = pixels[p2];
    pixels[p2] = 0xFF000000 |
      (Math.min(255, ((e2 >> 16) & 0xFF) + ib) << 16) |
      (Math.min(255, ((e2 >> 8) & 0xFF) + ig) << 8) |
      Math.min(255, (e2 & 0xFF) + ir);

    let e3 = pixels[p3];
    pixels[p3] = 0xFF000000 |
      (Math.min(255, ((e3 >> 16) & 0xFF) + ib) << 16) |
      (Math.min(255, ((e3 >> 8) & 0xFF) + ig) << 8) |
      Math.min(255, (e3 & 0xFF) + ir);
  }

  // --- Draw comet trails ---
  for (const cm of comets) {
    const lifeFrac = cm.life / cm.maxLife;
    const headBright = (1.0 - lifeFrac) * cm.brightness * 2.5;
    const ci = Math.min(255, (0.7 + cm.hue * 0.3) * 255) | 0;
    const ccr = paletteR[ci], ccg = paletteG[ci], ccb = paletteB[ci];

    for (let t = 0; t < cm.trailLen; t++) {
      const off = t * 3;
      const rx = cm.trail[off] * cosA - cm.trail[off+2] * sinA;
      const rz = cm.trail[off] * sinA + cm.trail[off+2] * cosA;
      const depth = rz + camDist;
      if (depth < 0.5) continue;
      const ps = camDist / depth;
      const sx = (cx + rx * scale * ps) | 0;
      const sy = (cy - cm.trail[off+1] * scale * ps) | 0;
      if (sx < 2 || sx >= width - 3 || sy < 2 || sy >= height - 3) continue;

      const frac = t / cm.trailLen;
      const bright = headBright * frac * frac;
      const ir = Math.min(255, (ccr * bright) | 0);
      const ig = Math.min(255, (ccg * bright) | 0);
      const ib = Math.min(255, (ccb * bright) | 0);

      const sz = t > cm.trailLen * 0.7 ? 3 : 2;
      for (let dy = 0; dy < sz; dy++) {
        for (let dx = 0; dx < sz; dx++) {
          const pi = (sy + dy) * width + (sx + dx);
          const ex = pixels[pi];
          pixels[pi] = 0xFF000000 |
            (Math.min(255, ((ex >> 16) & 0xFF) + ib) << 16) |
            (Math.min(255, ((ex >> 8) & 0xFF) + ig) << 8) |
            Math.min(255, (ex & 0xFF) + ir);
        }
      }
    }
  }

  // Put pixels to canvas — single operation, no blur, no glow pass
  ctx.putImageData(imgData, 0, 0);

  // --- Lightweight glow: just upscale a tiny downsampled copy ---
  // This uses GPU compositing only — no getImageData, no CPU blur
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.35 + audioEnergy * 0.2;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(canvas, 0, 0, width, height,
    -4, -4, width + 8, height + 8); // slight overscale = cheap "blur"
  ctx.globalAlpha = 1.0;
  ctx.globalCompositeOperation = 'source-over';

  // Vignette
  const vig = ctx.createRadialGradient(cx, cy, Math.min(width, height) * 0.25, cx, cy, Math.max(width, height) * 0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.4)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, width, height);
}

lastTime = 0;
requestAnimationFrame(frame);

setTimeout(() => {
  document.getElementById('fade').classList.add('out');
  document.getElementById('overlay').classList.add('visible');
}, 100);

// ============================================================
// VERIFICATION TESTS
// ============================================================
window.__COSMOS_TESTS__ = {
  runAll() {
    const results = [];
    const assert = (name, cond, detail) => results.push({ name, pass: !!cond, detail: detail || '' });

    // F1: Comets
    const c0 = comets.length; spawnComet();
    assert('F1.1 Comet spawns', comets.length === c0 + 1, `${c0} → ${comets.length}`);
    const cm = comets[comets.length-1];
    assert('F1.2 Comet props', cm.trail && cm.brightness > 0 && cm.maxLife > 0, 'has trail/brightness/maxLife');
    cm.trail[0]=cm.x; cm.trail[1]=cm.y; cm.trail[2]=cm.z; cm.trailLen=1;
    assert('F1.3 Trail stores', cm.trailLen === 1, `trailLen=${cm.trailLen}`);
    const b4 = comets.length; triggerMeteorShower();
    setTimeout(() => console.log('F1.4 Meteor shower:', comets.length > b4 + 3 ? 'PASS' : 'FAIL'), 2000);
    assert('F1.5 Comet lifecycle', cm.life <= cm.maxLife, `life=${cm.life} < max=${cm.maxLife}`);

    // F2: Audio
    assert('F2.1 Audio state', typeof audioActive === 'boolean' && typeof audioBass === 'number', `active=${audioActive}`);
    assert('F2.2 Mic button', document.getElementById('mic-btn') !== null, 'exists');
    audioBass = 0.8; const as = 1.0 + audioBass * 0.6;
    assert('F2.3 Bass scales', as > 1.4, `scale=${as.toFixed(2)}`);
    const te = 0.5*0.5 + 0.5*0.3 + 0.5*0.2;
    assert('F2.4 Energy bands', Math.abs(te - 0.5) < 0.01, `energy=${te}`);
    assert('F2.5 Bloom reacts', 0.35 + 0.8 * 0.2 > 0.5, 'alpha > 0.5 with energy');
    audioBass = 0;

    // F3: Shapes
    assert('F3.1 Shapes defined', SHAPES.length === 5 && SHAPES.includes('heart'), SHAPES.join(','));
    generateShapeTargets('heart'); let nz = 0;
    for (let i = 0; i < 100; i++) if (morphTargetX[i] !== 0 || morphTargetY[i] !== 0) nz++;
    assert('F3.2 Heart targets', nz > 90, `${nz}/100 non-zero`);
    generateShapeTargets('ring'); let rads = [];
    for (let i = 0; i < 200; i++) rads.push(Math.sqrt(morphTargetX[i]**2 + morphTargetY[i]**2));
    const avg = rads.reduce((a,b)=>a+b,0)/rads.length;
    assert('F3.3 Ring circular', avg > 2 && avg < 3, `avgR=${avg.toFixed(2)}`);
    generateShapeTargets('infinity'); let lc=0, rc=0;
    for (let i = 0; i < NUM_PARTICLES; i++) { if(morphTargetX[i]<-0.3)lc++; if(morphTargetX[i]>0.3)rc++; }
    assert('F3.4 Infinity lobes', lc > 500 && rc > 500, `L=${lc} R=${rc}`);
    assert('F3.5 Smoothstep', smoothstep(0.5) > 0.4 && smoothstep(0.5) < 0.6, `s(0.5)=${smoothstep(0.5).toFixed(3)}`);

    // Perf: Palette LUT
    bakePalette(0);
    assert('PERF Palette baked', paletteR[128] > 0 && paletteG[128] > 0, `R=${paletteR[128]} G=${paletteG[128]}`);

    generateShapeTargets(SHAPES[currentShape]); morphProgress = 1.0;
    console.log('%c=== COSMOS TESTS ===', 'font-size:14px;font-weight:bold;color:#00d4ff');
    let p=0,f=0;
    for (const r of results) {
      console.log(`${r.pass?'✅':'❌'} %c${r.name}%c — ${r.detail}`, r.pass?'color:#4f4':'color:#f44;font-weight:bold', '');
      r.pass ? p++ : f++;
    }
    console.log(`%c${p} passed, ${f} failed`, `font-weight:bold;color:${f?'#f44':'#4f4'}`);
    return { passed: p, failed: f, results };
  }
};
console.log('Run window.__COSMOS_TESTS__.runAll() for tests');
</script>
