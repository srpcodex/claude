<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cosmos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
  #overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
    opacity: 0; transition: opacity 2s ease-in;
  }
  #overlay.visible { opacity: 1; }
  #title {
    position: absolute; top: 24px; left: 24px;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    font-size: 18px; font-weight: 300; letter-spacing: 6px; text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }
  #hint {
    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    font-size: 14px; font-weight: 300; letter-spacing: 2px;
    color: rgba(255,255,255,0.4);
    transition: opacity 1.5s ease-out;
  }
  #hint.hidden { opacity: 0; }
  #fade {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; z-index: 20;
    transition: opacity 2s ease-out;
    pointer-events: none;
  }
  #fade.out { opacity: 0; }
</style>
</head>
<body>
<div id="fade"></div>
<div id="overlay">
  <div id="title">Cosmos</div>
  <div id="hint">touch to interact</div>
</div>
<canvas id="c"></canvas>
<script>
// ============================================================
// COSMOS — Interactive Particle Galaxy
// Canvas 2D version — maximum compatibility
// ============================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// --- Configuration ---
const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1);
const NUM_PARTICLES = isMobile ? 15000 : 40000;
const MAX_ATTRACTORS = 4;
let dpr = Math.min(window.devicePixelRatio || 1, 2);

// --- State ---
let width, height, cssW, cssH;
let time = 0;
let lastTime = 0;
let introProgress = 0;
let idleTime = 0;
let cameraAngle = 0;
let hintHidden = false;

const attractors = [];
for (let i = 0; i < MAX_ATTRACTORS; i++) {
  attractors.push({ x: 0, y: 0, strength: 0, id: -1 });
}

// --- Resize ---
function resize() {
  cssW = window.innerWidth;
  cssH = window.innerHeight;
  width = Math.floor(cssW * dpr);
  height = Math.floor(cssH * dpr);
  canvas.width = width;
  canvas.height = height;
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
}
window.addEventListener('resize', resize);
resize();

// --- Particles ---
const px = new Float32Array(NUM_PARTICLES);
const py = new Float32Array(NUM_PARTICLES);
const pz = new Float32Array(NUM_PARTICLES);
const vx = new Float32Array(NUM_PARTICLES);
const vy = new Float32Array(NUM_PARTICLES);
const vz = new Float32Array(NUM_PARTICLES);
const age = new Float32Array(NUM_PARTICLES);
const lifetime = new Float32Array(NUM_PARTICLES);
const baseR = new Float32Array(NUM_PARTICLES); // base radius for orbit

// Target positions for intro animation
const targetX = new Float32Array(NUM_PARTICLES);
const targetY = new Float32Array(NUM_PARTICLES);
const targetZ = new Float32Array(NUM_PARTICLES);

function initParticles() {
  const numArms = 3;
  for (let i = 0; i < NUM_PARTICLES; i++) {
    const arm = i % numArms;
    const armAngle = (arm / numArms) * Math.PI * 2;
    const t = Math.random();
    const r = 0.1 + t * 2.8;
    const spiralAngle = armAngle + Math.log(r + 1) * 2.5;
    const spread = (1.0 - t * 0.5) * 0.7;
    const angle = spiralAngle + (Math.random() - 0.5) * spread;

    // Target galaxy position
    targetX[i] = Math.cos(angle) * r + (Math.random() - 0.5) * 0.15;
    targetY[i] = Math.sin(angle) * r + (Math.random() - 0.5) * 0.15;
    targetZ[i] = (Math.random() - 0.5) * 0.2 * (1.0 + r * 0.05);

    // Start scattered
    const scatter = 4.0;
    px[i] = targetX[i] + (Math.random() - 0.5) * scatter;
    py[i] = targetY[i] + (Math.random() - 0.5) * scatter;
    pz[i] = targetZ[i] + (Math.random() - 0.5) * scatter * 0.3;

    // Tangential velocity
    const speed = 0.15 + Math.random() * 0.1;
    vx[i] = -Math.sin(angle) * speed;
    vy[i] = Math.cos(angle) * speed;
    vz[i] = (Math.random() - 0.5) * 0.02;

    age[i] = Math.random() * 12.0;
    lifetime[i] = 6.0 + Math.random() * 10.0;
    baseR[i] = r;
  }
}
initParticles();

// --- Simple noise for turbulence ---
function noise3d(x, y, z) {
  const n = Math.sin(x * 12.9898 + y * 78.233 + z * 45.164) * 43758.5453;
  return n - Math.floor(n);
}

// --- Input ---
function screenToWorld(sx, sy) {
  return [(sx / cssW) * 2 - 1, -((sy / cssH) * 2 - 1)];
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  idleTime = 0;
  if (!hintHidden) {
    document.getElementById('hint').classList.add('hidden');
    hintHidden = true;
  }
  for (let i = 0; i < MAX_ATTRACTORS; i++) {
    if (attractors[i].id === -1) {
      const [wx, wy] = screenToWorld(e.clientX, e.clientY);
      attractors[i] = { x: wx * 3.5, y: wy * 3.5, strength: 1.0, id: e.pointerId };
      break;
    }
  }
});

canvas.addEventListener('pointermove', (e) => {
  e.preventDefault();
  idleTime = 0;
  for (let i = 0; i < MAX_ATTRACTORS; i++) {
    if (attractors[i].id === e.pointerId) {
      const [wx, wy] = screenToWorld(e.clientX, e.clientY);
      attractors[i].x = wx * 3.5;
      attractors[i].y = wy * 3.5;
      break;
    }
  }
});

function releasePointer(e) {
  for (let i = 0; i < MAX_ATTRACTORS; i++) {
    if (attractors[i].id === e.pointerId) {
      attractors[i].id = -1;
      break;
    }
  }
}

canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
canvas.style.touchAction = 'none';

// --- Color palette ---
function nebulaPalette(t, hueShift) {
  // t: 0-1, hueShift: 0-1
  t = Math.max(0, Math.min(1, t));
  let r, g, b;
  if (t < 0.25) {
    const s = t / 0.25;
    r = 0.05 + s * 0.0;  g = 0.01 + s * 0.15;  b = 0.15 + s * 0.45;
  } else if (t < 0.5) {
    const s = (t - 0.25) / 0.25;
    r = 0.05 + s * 0.35;  g = 0.16 + s * 0.2;  b = 0.6 + s * (-0.1);
  } else if (t < 0.75) {
    const s = (t - 0.5) / 0.25;
    r = 0.4 + s * 0.5;  g = 0.36 + s * 0.1;  b = 0.5 - s * 0.3;
  } else {
    const s = (t - 0.75) / 0.25;
    r = 0.9 + s * 0.1;  g = 0.46 + s * 0.44;  b = 0.2 + s * 0.6;
  }

  // Rotate hue slightly
  const angle = hueShift * Math.PI * 2;
  const cos = Math.cos(angle), sin = Math.sin(angle);
  const nr = r * (0.7 + 0.3 * cos) + g * 0.3 * sin;
  const ng = g * (0.7 + 0.3 * cos) - r * 0.15 * sin + b * 0.15 * sin;
  const nb = b * (0.7 + 0.3 * cos) - g * 0.3 * sin;

  return [
    Math.max(0, Math.min(1, nr)) * 255,
    Math.max(0, Math.min(1, ng)) * 255,
    Math.max(0, Math.min(1, nb)) * 255
  ];
}

// --- Smoothstep ---
function smoothstep(x) {
  x = Math.max(0, Math.min(1, x));
  return x * x * (3 - 2 * x);
}

// --- Offscreen canvas for glow effect ---
let glowCanvas, glowCtx;
function setupGlow() {
  glowCanvas = document.createElement('canvas');
  glowCanvas.width = Math.floor(width / 4);
  glowCanvas.height = Math.floor(height / 4);
  glowCtx = glowCanvas.getContext('2d');
}
setupGlow();

window.addEventListener('resize', () => {
  resize();
  setupGlow();
});

// --- Sort buffer for depth sorting ---
const sortIndices = new Uint32Array(NUM_PARTICLES);
const sortDepths = new Float32Array(NUM_PARTICLES);

// --- Render Loop ---
function frame(now) {
  requestAnimationFrame(frame);

  now *= 0.001;
  if (lastTime === 0) lastTime = now;
  const dt = Math.min(now - lastTime, 0.05);
  lastTime = now;
  time += dt;
  idleTime += dt;
  introProgress = Math.min(introProgress + dt * 0.35, 1.0);
  const introT = smoothstep(introProgress);

  // Fade out released attractors
  for (let i = 0; i < MAX_ATTRACTORS; i++) {
    if (attractors[i].id === -1 && attractors[i].strength > 0) {
      attractors[i].strength = Math.max(0, attractors[i].strength - dt * 2.0);
    }
  }

  // Idle rotation
  if (idleTime > 5.0) {
    cameraAngle += dt * 0.1;
  }

  // Camera
  const cosA = Math.cos(cameraAngle);
  const sinA = Math.sin(cameraAngle);

  // --- Physics Update ---
  for (let i = 0; i < NUM_PARTICLES; i++) {
    age[i] += dt;
    if (age[i] > lifetime[i]) age[i] = 0;

    let x = px[i], y = py[i], z = pz[i];
    let _vx = vx[i], _vy = vy[i], _vz = vz[i];

    // Gravity toward center
    const dist = Math.sqrt(x * x + y * y + z * z) + 0.001;
    const gravStr = 0.5 / (dist * 0.5 + 0.1);
    const dx = -x / dist, dy = -y / dist, dz = -z / dist;
    _vx += dx * gravStr * dt;
    _vy += dy * gravStr * dt;
    _vz += dz * gravStr * dt * 0.5;

    // Tangential orbital velocity
    const tgx = -dy, tgy = dx;
    const orbSpeed = Math.sqrt(gravStr * dist) * 0.35;
    _vx += tgx * orbSpeed * dt * 0.3;
    _vy += tgy * orbSpeed * dt * 0.3;

    // Flatten toward disk
    _vz -= z * 0.3 * dt;

    // Simple turbulence
    const n1 = noise3d(x * 0.7 + time * 0.1, y * 0.7, z * 0.7);
    const n2 = noise3d(y * 0.7, z * 0.7 + time * 0.1, x * 0.7);
    const n3 = noise3d(z * 0.7, x * 0.7, y * 0.7 + time * 0.1);
    _vx += (n1 - 0.5) * 0.3 * dt;
    _vy += (n2 - 0.5) * 0.3 * dt;
    _vz += (n3 - 0.5) * 0.1 * dt;

    // Attractors
    for (let j = 0; j < MAX_ATTRACTORS; j++) {
      const a = attractors[j];
      if (a.strength > 0.01) {
        const adx = a.x - x, ady = a.y - y;
        const aDist = Math.sqrt(adx * adx + ady * ady) + 0.01;
        const aForce = a.strength * 5.0 / (aDist * aDist + 0.3);
        _vx += (adx / aDist) * aForce * dt;
        _vy += (ady / aDist) * aForce * dt;
        // Swirl
        _vx += (-ady / aDist) * aForce * 0.3 * dt;
        _vy += (adx / aDist) * aForce * 0.3 * dt;
      }
    }

    // Intro: pull toward target
    if (introT < 1.0) {
      const pullStr = (1.0 - introT) * 0.5;
      _vx += (targetX[i] - x) * pullStr * dt;
      _vy += (targetY[i] - y) * pullStr * dt;
      _vz += (targetZ[i] - z) * pullStr * dt;
    }

    // Damping
    _vx *= 0.997;
    _vy *= 0.997;
    _vz *= 0.997;

    // Speed limit
    const speed = Math.sqrt(_vx * _vx + _vy * _vy + _vz * _vz);
    if (speed > 2.0) {
      const s = 2.0 / speed;
      _vx *= s; _vy *= s; _vz *= s;
    }

    x += _vx * dt;
    y += _vy * dt;
    z += _vz * dt;

    // Soft boundary
    const r = Math.sqrt(x * x + y * y + z * z);
    if (r > 5.0) {
      const s = 5.0 / r;
      x *= s; y *= s; z *= s;
      _vx *= -0.2; _vy *= -0.2; _vz *= -0.2;
    }

    px[i] = x; py[i] = y; pz[i] = z;
    vx[i] = _vx; vy[i] = _vy; vz[i] = _vz;
  }

  // --- Render ---
  const cx = width / 2;
  const cy = height / 2;
  const scale = Math.min(width, height) * 0.12;
  const hueShift = (time * 0.016) % 1.0;

  // Clear main canvas
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(2, 1, 8, 1)';
  ctx.fillRect(0, 0, width, height);

  // Clear glow canvas
  glowCtx.clearRect(0, 0, glowCanvas.width, glowCanvas.height);
  const gScale = glowCanvas.width / width;

  // Compute projected positions and sort by depth
  for (let i = 0; i < NUM_PARTICLES; i++) {
    // Rotate by camera
    const rx = px[i] * cosA - pz[i] * sinA;
    const rz = px[i] * sinA + pz[i] * cosA;
    sortDepths[i] = rz;
    sortIndices[i] = i;
  }

  // We'll skip full sort for performance — just render with additive blending
  // which looks correct regardless of order

  // Draw particles
  ctx.globalCompositeOperation = 'lighter'; // additive blending!

  for (let i = 0; i < NUM_PARTICLES; i++) {
    const x = px[i], y = py[i], z = pz[i];

    // Rotate by camera angle
    const rx = x * cosA - z * sinA;
    const ry = y;
    const rz = x * sinA + z * cosA;

    // Perspective projection
    const depth = rz + 6.0; // camera at z=6
    if (depth < 0.1) continue;
    const projScale = 4.0 / depth;
    const sx = cx + rx * scale * projScale;
    const sy = cy - ry * scale * projScale;

    // Off-screen culling
    if (sx < -10 || sx > width + 10 || sy < -10 || sy > height + 10) continue;

    // Age fade
    const ageFrac = age[i] / lifetime[i];
    const fadeMask = smoothstep(ageFrac * 10.0) * smoothstep((1.0 - ageFrac) * 5.0);

    // Speed-based color
    const spd = Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i] + vz[i] * vz[i]);
    const colorT = Math.min(1, spd * 0.5 + (1.0 / depth) * 0.3);
    const [cr, cg, cb] = nebulaPalette(colorT, hueShift);

    // Depth fog
    const fog = Math.exp(-depth * 0.06);
    const alpha = fadeMask * fog * (0.3 + spd * 0.2) * projScale * 0.5;

    if (alpha < 0.01) continue;

    // Size
    const size = Math.max(0.5, projScale * (0.8 + spd * 0.3)) * dpr;

    // Draw on main canvas
    const a = Math.min(1, alpha);
    ctx.fillStyle = `rgba(${cr|0},${cg|0},${cb|0},${a.toFixed(3)})`;
    ctx.fillRect(sx - size * 0.5, sy - size * 0.5, size, size);

    // Draw bright particles on glow canvas too
    if (alpha > 0.15) {
      const ga = Math.min(1, alpha * 1.5);
      glowCtx.fillStyle = `rgba(${cr|0},${cg|0},${cb|0},${ga.toFixed(3)})`;
      const gs = size * gScale * 2;
      glowCtx.fillRect(sx * gScale - gs * 0.5, sy * gScale - gs * 0.5, gs, gs);
    }
  }

  // --- Apply bloom/glow ---
  // Draw blurred glow canvas over main with additive blend
  ctx.globalCompositeOperation = 'lighter';
  ctx.filter = `blur(${Math.max(4, 8 * dpr)}px)`;
  ctx.globalAlpha = 0.6;
  ctx.drawImage(glowCanvas, 0, 0, width, height);
  ctx.filter = 'none';

  // Second wider glow pass
  ctx.globalAlpha = 0.3;
  ctx.filter = `blur(${Math.max(8, 16 * dpr)}px)`;
  ctx.drawImage(glowCanvas, 0, 0, width, height);
  ctx.filter = 'none';
  ctx.globalAlpha = 1.0;

  // Vignette
  ctx.globalCompositeOperation = 'source-over';
  const vignette = ctx.createRadialGradient(cx, cy, Math.min(width, height) * 0.2, cx, cy, Math.max(width, height) * 0.7);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, width, height);
}

// --- Start ---
lastTime = 0;
requestAnimationFrame(frame);

// Fade in
setTimeout(() => {
  document.getElementById('fade').classList.add('out');
  document.getElementById('overlay').classList.add('visible');
}, 100);
</script>
</body>
</html>
