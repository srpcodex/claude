<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cosmos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000;
    touch-action: none;
    overscroll-behavior: none;
  }
  canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0;
    touch-action: none;
  }
  #overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
    opacity: 0; transition: opacity 2s ease-in;
  }
  #overlay.visible { opacity: 1; }
  #title {
    position: absolute; top: 24px; left: 24px;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    font-size: 18px; font-weight: 300; letter-spacing: 6px; text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }
  #hint {
    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    font-size: 14px; font-weight: 300; letter-spacing: 2px;
    color: rgba(255,255,255,0.4);
    transition: opacity 1.5s ease-out;
    white-space: nowrap;
  }
  #hint.hidden { opacity: 0; }
  #fade {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; z-index: 20;
    transition: opacity 2s ease-out;
    pointer-events: none;
  }
  #fade.out { opacity: 0; }
</style>
</head>
<body>
<div id="fade"></div>
<div id="overlay">
  <div id="title">Cosmos</div>
  <div id="hint">touch to interact</div>
</div>
<canvas id="c"></canvas>
<script>
// ============================================================
// COSMOS — Interactive Particle Galaxy
// Canvas 2D version — maximum compatibility
// ============================================================

// Prevent all context menus and selection on mobile
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());
document.addEventListener('touchstart', e => { if (e.target === canvas) e.preventDefault(); }, { passive: false });
document.addEventListener('touchmove', e => { if (e.target === canvas) e.preventDefault(); }, { passive: false });
document.addEventListener('touchend', e => { if (e.target === canvas) e.preventDefault(); }, { passive: false });

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// --- Configuration ---
const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1);
const NUM_PARTICLES = isMobile ? 50000 : 120000;
const MAX_ATTRACTORS = 4;
let dpr = Math.min(window.devicePixelRatio || 1, 2);

// --- State ---
let width, height, cssW, cssH;
let time = 0;
let lastTime = 0;
let introProgress = 0;
let idleTime = 0;
let cameraAngle = 0;
let hintHidden = false;

const attractors = [];
for (let i = 0; i < MAX_ATTRACTORS; i++) {
  attractors.push({ x: 0, y: 0, strength: 0, id: -1 });
}

// --- Resize ---
function resize() {
  cssW = window.innerWidth;
  cssH = window.innerHeight;
  width = Math.floor(cssW * dpr);
  height = Math.floor(cssH * dpr);
  canvas.width = width;
  canvas.height = height;
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
}
window.addEventListener('resize', resize);
resize();

// --- Particles ---
const px = new Float32Array(NUM_PARTICLES);
const py = new Float32Array(NUM_PARTICLES);
const pz = new Float32Array(NUM_PARTICLES);
const vx = new Float32Array(NUM_PARTICLES);
const vy = new Float32Array(NUM_PARTICLES);
const vz = new Float32Array(NUM_PARTICLES);
const age = new Float32Array(NUM_PARTICLES);
const lifetime = new Float32Array(NUM_PARTICLES);

// Target positions for intro animation
const targetX = new Float32Array(NUM_PARTICLES);
const targetY = new Float32Array(NUM_PARTICLES);
const targetZ = new Float32Array(NUM_PARTICLES);

function initParticles() {
  const numArms = 4;
  for (let i = 0; i < NUM_PARTICLES; i++) {
    const arm = i % numArms;
    const armAngle = (arm / numArms) * Math.PI * 2;
    const t = Math.pow(Math.random(), 0.6); // bias toward center for density
    const r = 0.05 + t * 4.0; // larger galaxy radius
    const spiralAngle = armAngle + Math.log(r + 1) * 3.0;
    const spread = (1.0 - t * 0.4) * 0.9;
    const angle = spiralAngle + (Math.random() - 0.5) * spread;

    // Target galaxy position
    targetX[i] = Math.cos(angle) * r + (Math.random() - 0.5) * 0.2;
    targetY[i] = Math.sin(angle) * r + (Math.random() - 0.5) * 0.2;
    targetZ[i] = (Math.random() - 0.5) * 0.3 * (1.0 + r * 0.08);

    // Start scattered
    const scatter = 5.0;
    px[i] = targetX[i] + (Math.random() - 0.5) * scatter;
    py[i] = targetY[i] + (Math.random() - 0.5) * scatter;
    pz[i] = targetZ[i] + (Math.random() - 0.5) * scatter * 0.3;

    // Tangential velocity
    const speed = 0.2 + Math.random() * 0.15;
    vx[i] = -Math.sin(angle) * speed;
    vy[i] = Math.cos(angle) * speed;
    vz[i] = (Math.random() - 0.5) * 0.02;

    age[i] = Math.random() * 12.0;
    lifetime[i] = 6.0 + Math.random() * 10.0;
  }
}
initParticles();

// --- Simple noise for turbulence ---
function noise3d(x, y, z) {
  const n = Math.sin(x * 12.9898 + y * 78.233 + z * 45.164) * 43758.5453;
  return n - Math.floor(n);
}

// --- Input: convert screen touch to world-space attractor position ---
// This must match the projection used in rendering exactly.
function screenToWorld(clientX, clientY) {
  // The renderer projects world (rx, ry) to screen as:
  //   sx_canvas = cx + rx * scale * projScale
  //   sy_canvas = cy - ry * scale * projScale
  // where projScale = camDist / depth, depth = rz + camDist
  // For attractor at z=0 (rz=0 after camera rotation):
  //   depth = camDist, projScale = 1.0
  // So: rx = (sx_canvas - cx) / scale
  //     ry = -(sy_canvas - cy) / scale

  const cx = width / 2;
  const cy = height / 2;
  const scale = Math.min(width, height) * 0.18;

  // Convert client coords to canvas pixel coords
  const canvasX = clientX * dpr;
  const canvasY = clientY * dpr;

  const wx = (canvasX - cx) / scale;
  const wy = -(canvasY - cy) / scale;
  return [wx, wy];
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  idleTime = 0;
  if (!hintHidden) {
    document.getElementById('hint').classList.add('hidden');
    hintHidden = true;
  }
  for (let i = 0; i < MAX_ATTRACTORS; i++) {
    if (attractors[i].id === -1) {
      const [wx, wy] = screenToWorld(e.clientX, e.clientY);
      attractors[i] = { x: wx, y: wy, strength: 1.0, id: e.pointerId };
      break;
    }
  }
});

canvas.addEventListener('pointermove', (e) => {
  e.preventDefault();
  idleTime = 0;
  for (let i = 0; i < MAX_ATTRACTORS; i++) {
    if (attractors[i].id === e.pointerId) {
      const [wx, wy] = screenToWorld(e.clientX, e.clientY);
      attractors[i].x = wx;
      attractors[i].y = wy;
      break;
    }
  }
});

function releasePointer(e) {
  for (let i = 0; i < MAX_ATTRACTORS; i++) {
    if (attractors[i].id === e.pointerId) {
      attractors[i].id = -1;
      break;
    }
  }
}

canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
canvas.style.touchAction = 'none';

// --- Color palette (brighter, more vivid) ---
function nebulaPalette(t, hueShift) {
  t = Math.max(0, Math.min(1, t));
  let r, g, b;
  if (t < 0.2) {
    const s = t / 0.2;
    r = 0.15 + s * 0.1;  g = 0.05 + s * 0.3;  b = 0.4 + s * 0.4;
  } else if (t < 0.45) {
    const s = (t - 0.2) / 0.25;
    r = 0.25 + s * 0.4;  g = 0.35 + s * 0.15;  b = 0.8 - s * 0.1;
  } else if (t < 0.7) {
    const s = (t - 0.45) / 0.25;
    r = 0.65 + s * 0.3;  g = 0.5 + s * 0.15;  b = 0.7 - s * 0.35;
  } else {
    const s = (t - 0.7) / 0.3;
    r = 0.95 + s * 0.05;  g = 0.65 + s * 0.3;  b = 0.35 + s * 0.55;
  }

  // Rotate hue
  const angle = hueShift * Math.PI * 2;
  const cos = Math.cos(angle), sin = Math.sin(angle);
  const nr = r * (0.7 + 0.3 * cos) + g * 0.3 * sin;
  const ng = g * (0.7 + 0.3 * cos) - r * 0.15 * sin + b * 0.15 * sin;
  const nb = b * (0.7 + 0.3 * cos) - g * 0.3 * sin;

  return [
    Math.max(0, Math.min(1, nr)) * 255,
    Math.max(0, Math.min(1, ng)) * 255,
    Math.max(0, Math.min(1, nb)) * 255
  ];
}

// --- Smoothstep ---
function smoothstep(x) {
  x = Math.max(0, Math.min(1, x));
  return x * x * (3 - 2 * x);
}

// --- Offscreen canvas for glow effect ---
let glowCanvas, glowCtx;
function setupGlow() {
  glowCanvas = document.createElement('canvas');
  glowCanvas.width = Math.floor(width / 4);
  glowCanvas.height = Math.floor(height / 4);
  glowCtx = glowCanvas.getContext('2d');
}
setupGlow();

window.addEventListener('resize', () => {
  resize();
  setupGlow();
});

// --- Use ImageData for fast pixel rendering ---
let imgData, pixels;
function setupImageData() {
  imgData = ctx.createImageData(width, height);
  pixels = new Uint32Array(imgData.data.buffer);
}
setupImageData();
window.addEventListener('resize', setupImageData);

// --- Render Loop ---
function frame(now) {
  requestAnimationFrame(frame);

  now *= 0.001;
  if (lastTime === 0) lastTime = now;
  const dt = Math.min(now - lastTime, 0.05);
  lastTime = now;
  time += dt;
  idleTime += dt;
  introProgress = Math.min(introProgress + dt * 0.35, 1.0);
  const introT = smoothstep(introProgress);

  // Fade out released attractors
  for (let i = 0; i < MAX_ATTRACTORS; i++) {
    if (attractors[i].id === -1 && attractors[i].strength > 0) {
      attractors[i].strength = Math.max(0, attractors[i].strength - dt * 2.0);
    }
  }

  // Idle rotation
  if (idleTime > 5.0) {
    cameraAngle += dt * 0.1;
  }

  // Camera
  const cosA = Math.cos(cameraAngle);
  const sinA = Math.sin(cameraAngle);
  const camDist = 6.0;

  // --- Physics Update ---
  for (let i = 0; i < NUM_PARTICLES; i++) {
    age[i] += dt;
    if (age[i] > lifetime[i]) age[i] = 0;

    let x = px[i], y = py[i], z = pz[i];
    let _vx = vx[i], _vy = vy[i], _vz = vz[i];

    // Gravity toward center
    const dist = Math.sqrt(x * x + y * y + z * z) + 0.001;
    const gravStr = 0.5 / (dist * 0.5 + 0.1);
    const dx = -x / dist, dy = -y / dist, dz = -z / dist;
    _vx += dx * gravStr * dt;
    _vy += dy * gravStr * dt;
    _vz += dz * gravStr * dt * 0.5;

    // Tangential orbital velocity
    const tgx = -dy, tgy = dx;
    const orbSpeed = Math.sqrt(gravStr * dist) * 0.35;
    _vx += tgx * orbSpeed * dt * 0.3;
    _vy += tgy * orbSpeed * dt * 0.3;

    // Flatten toward disk
    _vz -= z * 0.3 * dt;

    // Simple turbulence
    const n1 = noise3d(x * 0.7 + time * 0.1, y * 0.7, z * 0.7);
    const n2 = noise3d(y * 0.7, z * 0.7 + time * 0.1, x * 0.7);
    const n3 = noise3d(z * 0.7, x * 0.7, y * 0.7 + time * 0.1);
    _vx += (n1 - 0.5) * 0.3 * dt;
    _vy += (n2 - 0.5) * 0.3 * dt;
    _vz += (n3 - 0.5) * 0.1 * dt;

    // Attractors
    for (let j = 0; j < MAX_ATTRACTORS; j++) {
      const a = attractors[j];
      if (a.strength > 0.01) {
        const adx = a.x - x, ady = a.y - y;
        const aDist = Math.sqrt(adx * adx + ady * ady) + 0.01;
        const aForce = a.strength * 6.0 / (aDist * aDist + 0.3);
        _vx += (adx / aDist) * aForce * dt;
        _vy += (ady / aDist) * aForce * dt;
        // Swirl
        _vx += (-ady / aDist) * aForce * 0.3 * dt;
        _vy += (adx / aDist) * aForce * 0.3 * dt;
      }
    }

    // Intro: pull toward target
    if (introT < 1.0) {
      const pullStr = (1.0 - introT) * 0.5;
      _vx += (targetX[i] - x) * pullStr * dt;
      _vy += (targetY[i] - y) * pullStr * dt;
      _vz += (targetZ[i] - z) * pullStr * dt;
    }

    // Damping
    _vx *= 0.997;
    _vy *= 0.997;
    _vz *= 0.997;

    // Speed limit
    const speed = Math.sqrt(_vx * _vx + _vy * _vy + _vz * _vz);
    if (speed > 2.5) {
      const s = 2.5 / speed;
      _vx *= s; _vy *= s; _vz *= s;
    }

    x += _vx * dt;
    y += _vy * dt;
    z += _vz * dt;

    // Soft boundary (larger)
    const r = Math.sqrt(x * x + y * y + z * z);
    if (r > 7.0) {
      const s = 7.0 / r;
      x *= s; y *= s; z *= s;
      _vx *= -0.2; _vy *= -0.2; _vz *= -0.2;
    }

    px[i] = x; py[i] = y; pz[i] = z;
    vx[i] = _vx; vy[i] = _vy; vz[i] = _vz;
  }

  // --- Render via ImageData for speed ---
  const cx = width / 2;
  const cy = height / 2;
  const scale = Math.min(width, height) * 0.18; // bigger galaxy on screen
  const hueShift = (time * 0.016) % 1.0;

  // Clear pixel buffer to near-black
  for (let i = 0; i < pixels.length; i++) {
    pixels[i] = 0xFF080210; // ABGR: alpha=FF, B=08, G=02, R=10 → dark purple-black
  }

  // Draw particles directly into pixel buffer (fastest possible)
  for (let i = 0; i < NUM_PARTICLES; i++) {
    const x = px[i], y = py[i], z = pz[i];

    // Rotate by camera angle
    const rx = x * cosA - z * sinA;
    const ry = y;
    const rz = x * sinA + z * cosA;

    // Perspective projection
    const depth = rz + camDist;
    if (depth < 0.1) continue;
    const projScale = camDist / depth;
    const sx = (cx + rx * scale * projScale) | 0;
    const sy = (cy - ry * scale * projScale) | 0;

    // Bounds check
    if (sx < 1 || sx >= width - 1 || sy < 1 || sy >= height - 1) continue;

    // Age fade
    const ageFrac = age[i] / lifetime[i];
    const fadeMask = smoothstep(ageFrac * 8.0) * smoothstep((1.0 - ageFrac) * 4.0);

    // Speed-based color
    const spd = Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i] + vz[i] * vz[i]);
    const colorT = Math.min(1, spd * 0.4 + (1.0 / depth) * 0.5);
    const [cr, cg, cb] = nebulaPalette(colorT, hueShift);

    // Depth fog
    const fog = Math.exp(-depth * 0.04);

    // Much brighter base alpha
    const alpha = fadeMask * fog * (0.6 + spd * 0.4) * projScale;

    if (alpha < 0.02) continue;

    const a = Math.min(1, alpha);
    const ir = (cr * a) | 0;
    const ig = (cg * a) | 0;
    const ib = (cb * a) | 0;

    // Additive blend into pixel buffer — write a 2x2 block for brighter, fatter stars
    const size = projScale > 0.8 ? 2 : 1;

    if (size === 2) {
      for (let dy = 0; dy < 2; dy++) {
        for (let dx = 0; dx < 2; dx++) {
          const pi = (sy + dy) * width + (sx + dx);
          const existing = pixels[pi];
          const er = existing & 0xFF;
          const eg = (existing >> 8) & 0xFF;
          const eb = (existing >> 16) & 0xFF;
          const nr = Math.min(255, er + ir);
          const ng = Math.min(255, eg + ig);
          const nb = Math.min(255, eb + ib);
          pixels[pi] = 0xFF000000 | (nb << 16) | (ng << 8) | nr;
        }
      }
    } else {
      const pi = sy * width + sx;
      const existing = pixels[pi];
      const er = existing & 0xFF;
      const eg = (existing >> 8) & 0xFF;
      const eb = (existing >> 16) & 0xFF;
      const nr = Math.min(255, er + ir);
      const ng = Math.min(255, eg + ig);
      const nb = Math.min(255, eb + ib);
      pixels[pi] = 0xFF000000 | (nb << 16) | (ng << 8) | nr;
    }

    // Extra bright core for fast/close particles
    if (alpha > 0.5 && size === 2) {
      const pi = sy * width + sx;
      const existing = pixels[pi];
      const er = existing & 0xFF;
      const eg = (existing >> 8) & 0xFF;
      const eb = (existing >> 16) & 0xFF;
      const boost = (alpha * 0.5) | 0;
      const nr2 = Math.min(255, er + ir + boost * 2);
      const ng2 = Math.min(255, eg + ig + boost * 2);
      const nb2 = Math.min(255, eb + ib + boost);
      pixels[pi] = 0xFF000000 | (nb2 << 16) | (ng2 << 8) | nr2;
    }
  }

  // Put pixels to main canvas
  ctx.putImageData(imgData, 0, 0);

  // --- Glow pass: draw bright areas to glow canvas, then blur ---
  const gW = glowCanvas.width;
  const gH = glowCanvas.height;
  const gScaleX = gW / width;
  const gScaleY = gH / height;

  // Copy downscaled version to glow canvas
  glowCtx.clearRect(0, 0, gW, gH);
  glowCtx.drawImage(canvas, 0, 0, gW, gH);

  // Composite blurred glow back additively
  ctx.globalCompositeOperation = 'lighter';

  ctx.filter = `blur(${Math.max(6, 12 * dpr)}px)`;
  ctx.globalAlpha = 0.7;
  ctx.drawImage(glowCanvas, 0, 0, width, height);

  ctx.filter = `blur(${Math.max(12, 24 * dpr)}px)`;
  ctx.globalAlpha = 0.4;
  ctx.drawImage(glowCanvas, 0, 0, width, height);

  ctx.filter = 'none';
  ctx.globalAlpha = 1.0;
  ctx.globalCompositeOperation = 'source-over';

  // Vignette
  const vignette = ctx.createRadialGradient(cx, cy, Math.min(width, height) * 0.25, cx, cy, Math.max(width, height) * 0.75);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, width, height);
}

// --- Start ---
lastTime = 0;
requestAnimationFrame(frame);

// Fade in
setTimeout(() => {
  document.getElementById('fade').classList.add('out');
  document.getElementById('overlay').classList.add('visible');
}, 100);
</script>
</body>
</html>
